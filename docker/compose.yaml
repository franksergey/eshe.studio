name: eshe-studio

secrets:
  api_secret:
    file: ../.secrets/api_secret.txt

networks:
  backend-network:
    driver: bridge

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    pull_policy: missing
    image: franksergey/eshe.studio
    restart: unless-stopped

    environment:
      - APP_USERS_SECRETFILE=/run/secrets/api_secret

    networks:
      - backend-network

    secrets:
      - api_secret
