[project]
name = "eshe-studio-site"
version = "0.1.0"

description = "A site developed for eshe.studio."
readme = "README.md"

authors = [
    { name = "franksergey", email = "s@frank.ru" },
    { name = "Soucelover", email = "mr.ktotov@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
keywords = []

# ===================
# Requirements (Deps)
# ===================
# TIP: Narrow Python version if it would fit your environment better
# NOTE: If you narrow, modify .github/workflows/quality-assurance.yaml and tox.toml
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]~=0.141.0",
    "python-json-logger~=4.2",
    "uvloop>=0.22.1 ; sys_platform == 'linux'",
    "winloop>=0.6.3 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
rich = [
    "rich~=15.0",
]

[dependency-groups]
dev = [
    "invoke>=3.0",
    "pre-commit>=4.6",
    "pyrefly>=1.3",
    "pyright>=1.1,<1.2",
    "ruff>=0.16,<1.0",
    "types-pyyaml>=6.0.12.20260724",
]

tests = [
    "tox~=4.0",
    "tox-uv>=1.35,<2.0",
]

[tool.uv]
default-groups = ["dev", "tests"]

# =============
# Project Links
# =============
[project.urls]
Repository = "https://github.com/franksergey/eshe.studio.git"
Issues = "https://github.com/franksergey/eshe.studio/issues"
Changelog = "https://github.com/franksergey/eshe.studio/releases"

# ============
# Build System
# ============
[project.scripts]
server = "server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.hatch.build.targets.sdist]
include = ["src/server", "pyproject.toml", "uv.lock", "tox.toml", "README.md"]

# =============
# Ruff Settings
# =============
[tool.ruff]
line-length = 79

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules
select = ["ALL"]
ignore = [
    # "D",      # TIP: Uncomment if you intend to write documentation from the start
    "ARG",    # flake8-unused-arguments (sometimes useful for refactoring)
    "RUF001",
    "RUF002",
    "RUF003",
    "TD003",  # Inserting Link issues
    "FIX",    # Consider resolving issue -- usually very annoying
    "COM812", # Redundant with formatter
    "CPY001",
]
extend-safe-fixes = ["TC", "PYI021"]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"!src/**" = ["D", "SLF"]
"tests/**/*" = ["S101", "INP001", "PLR2004"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
    "invoke.tasks.task",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.options",
    "fastapi.APIRouter.head",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.trace",
]

# ================
# Pyright Settings
# ================
[tool.pyright]
typeCheckingMode = "strict" # Change to standard if it's too tight for ya

reportUnusedImport = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportUnnecessaryCast = "warning"

# ================
# Pyrefly Settings
# ================
[tool.pyrefly]
preset = "strict"

[tool.pyrefly.errors]
redundant-cast = "warn"
