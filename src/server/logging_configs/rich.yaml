# The schema is defined in logging docs:
# https://docs.python.org/library/logging.config.html#dictionary-schema-details

version: 1
disable_existing_loggers: false

formatters:
  rich:
    format: "%(message)s"
    datefmt: "[%X]"

handlers:
  default:
    class: server.logging.WindowsRichHandler
    formatter: rich
    rich_tracebacks: true
    markup: true
    # show_path: false

root:
  level: DEBUG
  handlers: [default]

loggers:
  uvicorn:
    level: INFO
    handlers: [default]
    propagate: false
  uvicorn.error:
    level: INFO
  uvicorn.access:
    level: INFO
  aiosqlite:
    level: INFO
  watchfiles.main:
    level: INFO
  alembic:
    level: INFO
  alembic.runtime.plugins:
    level: WARNING
