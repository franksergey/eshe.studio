# The schema is defined in logging docs:
# https://docs.python.org/library/logging.config.html#dictionary-schema-details

version: 1
disable_existing_loggers: false

formatters:
  json:
    (): pythonjsonlogger.jsonlogger.JsonFormatter
    # format: "%(asctime)s %(levelname)s %(name)s %(message)s %(process)d %(threadName)s %(filename)s %(funcName)s %(lineno)d"
    reserved_attrs: [args, exc_info, exc_text, msg, stack_info, levelno, pathname, module, created, msecs, relativeCreated, thread, process, color_message]
    rename_fields:
      message: msg
      asctime: timestamp
      levelname: level
      lineno: line
      funcName: func
      threadName: thread
      processName: process
      taskName: task

  access:
    (): server.logging.JsonAccessFormatter
    format: [client_addr, request_line, status_code, name, levelname, filename, lineno, funcName, threadName, processName, taskName]
    rename_fields:
      message: msg
      asctime: timestamp
      levelname: level
      lineno: line
      funcName: func
      threadName: thread
      processName: process
      taskName: task

handlers:
  default:
    class: logging.StreamHandler
    formatter: json
    stream: ext://sys.stdout

  access:
    class: logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout

root:
  level: DEBUG
  handlers: [default]

loggers:
  uvicorn:
    level: INFO
    handlers: [default]
    propagate: false
  uvicorn.error:
    level: INFO
  uvicorn.access:
    level: INFO
    handlers: [access]
    propagate: false
  aiosqlite:
    level: INFO
  watchfiles.main:
    level: INFO
